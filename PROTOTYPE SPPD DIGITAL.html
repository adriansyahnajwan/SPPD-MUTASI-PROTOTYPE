<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipe SPPD Mutasi Karyawan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
/* Layout: kiri = aplikasi web JM-Click (topbar + sidebar + konten) bergaya Figma JM-Click, kanan = panel simulasi. Satu tema terang. */
:root{
  --primary:#08578f; --navy:#002a5c; --back:#77a4c7; --ink:#1d2433; --muted:#7b8494; --line:#e3e8ee;
  --page:#eef2f6; --card:#ffffff; --soft:#eaf2f9; --ok:#2f7d32; --ok-soft:#c3dfbd; --bad:#d32f2f; --bad-soft:#ffe9e5;
  --warn:#9a6200; --warn-soft:#fff1d6; --font:"Inter", "Segoe UI", system-ui, sans-serif; --mono:"IBM Plex Mono", ui-monospace, monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.45 var(--font)}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #f0b429;outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line)}
.top h1{font-size:17px;font-weight:800;color:var(--primary)}
.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;padding:20px;max-width:1560px;margin:0 auto}
@media (max-width:1180px){.wrap{grid-template-columns:1fr}}
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.hdr .bk{width:32px;height:32px;border-radius:50%;border:0;background:var(--back);color:#fff;display:grid;place-items:center;flex:none}
.hdr h2{font-size:20px;font-weight:700;color:var(--primary)}
.sec{font-size:15px;font-weight:700;color:var(--primary)}
.sub{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid #edf1f5;border-radius:14px;box-shadow:0 2px 10px rgba(8,87,143,.07);padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
label.f .hint{font-weight:400;color:var(--muted)}
input[type=text],input[type=password],input[type=date],select{width:100%;height:44px;border:1px solid #dfe4ea;border-radius:10px;padding:0 12px;background:#fff}
input[readonly]{background:#f7f9fb;color:var(--muted)}
input::placeholder{color:#a3aab6}
.inwrap{position:relative}
.inwrap svg{position:absolute;right:12px;top:12px;color:#5b6472;pointer-events:none}
.inwrap.left svg{left:12px;right:auto}
.inwrap.left input{padding-left:38px}
.btn{height:44px;border-radius:10px;border:1px solid #dfe4ea;background:#fff;color:var(--primary);font-weight:700;padding:0 20px;white-space:nowrap}
.btn.block{width:100%}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.sm{height:34px;width:auto;font-size:13px;padding:0 12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--primary);font-weight:700;padding:6px;align-self:center}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.seg button{height:38px;border-radius:20px;border:1px solid #dfe4ea;background:#fff;font-weight:600;color:#3b4453}
.seg button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--primary);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.rows{display:flex;flex-direction:column}
.rows .r{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid #edf1f5;font-size:13px}
.rows .r:last-child{border-bottom:0}
.rows .r span:first-child{color:var(--muted);flex:none}
.rows .r span:last-child{text-align:right;font-weight:600;color:#2b3342}
.alert{border-radius:14px;padding:14px;background:var(--bad-soft)}
.alert .t{display:flex;gap:8px;align-items:center;color:var(--bad);font-weight:700;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid rgba(211,47,47,.15)}
.alert ul{margin:0;padding-left:18px;font-size:13px;color:#3b4453;display:flex;flex-direction:column;gap:6px}
.alert.info{background:var(--soft)}
.alert.info .t{color:var(--primary);border-color:rgba(8,87,143,.15)}
.alert.info p{margin:0;font-size:13px;color:#3b4453}
.okc{width:104px;height:104px;border-radius:50%;background:var(--ok-soft);display:grid;place-items:center;margin:10px auto 4px}
.center{text-align:center}
.big{font-size:22px;font-weight:800;color:var(--primary)}
.navbar{position:fixed;}
.tbar{background:var(--navy);color:#fff;border-radius:8px;padding:9px 12px;font-size:12px;font-weight:600}
/* Web app */
.app{align-self:start;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-height:800px;box-shadow:0 10px 36px rgba(0,42,92,.10)}
.topbar{flex:none;height:60px;display:flex;align-items:center;gap:14px;padding:0 22px;background:#fff;border-bottom:1px solid var(--line)}
.brandm{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;letter-spacing:-.3px;color:#111}
.logo{position:relative;flex:none}
.logo i{position:absolute;left:50%;top:50%;border-radius:50%;background:linear-gradient(180deg,#1f5bb5,#7fa7e0 55%,#f2c46b);transform-origin:50% 50%}
.logo.sm{width:34px;height:34px}
.logo.sm i{width:4px;height:13px;margin:-6.5px 0 0 -2px}
.logo.lg{width:150px;height:150px}
.logo.lg i{width:15px;height:60px;margin:-30px 0 0 -7.5px}
.topbar .sp{flex:1}
.bell{background:none;border:0;position:relative;padding:6px;color:#5b6472;border-radius:10px}
.bell:hover{background:var(--soft)}
.bell .dot{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:9px;background:#e53935;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid #fff;padding:0 3px}
.prof{display:flex;align-items:center;gap:10px;padding-left:14px;border-left:1px solid var(--line)}
.ava{width:38px;height:38px;border-radius:50%;border:1.5px solid #5b6472;display:grid;place-items:center;flex:none;color:#5b6472}
.prof b{display:block;color:var(--primary);font-size:13.5px}
.online{width:9px;height:9px;border-radius:50%;background:#2fb344}
.body{display:grid;grid-template-columns:240px minmax(0,1fr);flex:1;min-height:0}
.side{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;background:#fbfcfe}
.side .lab{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:10px 12px 4px}
.side button{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;border:0;background:none;text-align:left;font-weight:600;color:#3b4453;position:relative}
.side button:hover:not(:disabled){background:#f0f5fa}
.side button.on{background:var(--soft);color:var(--primary)}
.side button:disabled{opacity:.5;cursor:default}
.side .nd{margin-left:auto;width:8px;height:8px;border-radius:50%;background:#e53935}
.scr{padding:28px 32px 48px;background:linear-gradient(180deg,#fff 0%,#fff 72%,#eef5fb 90%,#d5e5f1 100%);background-attachment:local}
.content{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.narrow{max-width:560px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
@media (max-width:820px){.body{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.side .lab{display:none}.side button{flex:none}.scr{padding:20px 16px 36px}.prof div{display:none}}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:980px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tcard{min-height:200px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:1.5px solid #dfe4ea;border-radius:14px;padding:14px;cursor:pointer}
.opt b{display:block;font-size:14px;margin-bottom:2px}
.opt:hover{border-color:var(--primary)}
.opt.on{border-color:var(--primary);background:var(--soft);box-shadow:0 0 0 2px rgba(8,87,143,.15)}
.bignum{font-size:26px;font-weight:800;color:var(--primary)}
input[type=time]{width:100%;height:44px;border:1px solid #dfe4ea;border-radius:10px;padding:0 12px;background:#fff}
.tcard.off{opacity:.6}
.side .grp{display:flex;align-items:center;gap:2px;border-radius:10px}
.side button svg{flex:none}
.side .grp > button:first-child span.lbl{overflow:hidden;text-overflow:ellipsis}
.side .grp > button:first-child{flex:1;min-width:0;white-space:nowrap}
.side .chev{flex:none;width:30px;height:30px;padding:0;display:grid;place-items:center;border-radius:8px;color:#5b6472}
.side .chev svg{transform:rotate(90deg);transition:transform .15s}
.side .chev.open svg{transform:rotate(-90deg)}
.side .chev:hover{background:#f0f5fa}
.side .sub-menu{display:flex;flex-direction:column;gap:2px;margin:2px 0 4px 14px;padding-left:4px;border-left:1.5px solid #e3e8ee}
.side .soon{margin-left:auto;font-size:10px;font-weight:700;color:var(--muted);background:#eef2f6;border-radius:6px;padding:1px 6px}
.plist{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:6px;color:#2b3342}
.psteps{margin:0;padding:0;list-style:none;counter-reset:ps;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:820px){.psteps{grid-template-columns:1fr}}
.psteps li{counter-increment:ps;background:var(--soft);border-radius:12px;padding:12px 12px 12px 48px;position:relative;font-size:13px;display:flex;flex-direction:column;gap:4px}
.psteps li::before{content:counter(ps);position:absolute;left:12px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;font-weight:700;display:grid;place-items:center;font-size:12px}
.psteps li span{color:#3b4453}
@media (max-width:820px){.g2{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end}
.lt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftable{width:100%;border-collapse:collapse;font-size:13px}
.ftable th{text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:0 10px 8px;border-bottom:1px solid #edf1f5}
.ftable td{padding:11px 10px;border-bottom:1px solid #edf1f5;vertical-align:middle}
.ftable tr:last-child td{border-bottom:0}
.ftable td.n{font-weight:600}
.ftable tr.rej td{background:#fff7f6}
.tblw{overflow-x:auto}
.famfoot{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:12px 10px 0;margin-top:4px;border-top:1px solid #edf1f5}
.famfoot span:first-child{color:var(--muted)}
.famfoot span:last-child{font-weight:600}
@media (max-width:620px){.mgrid{grid-template-columns:1fr 1fr}}
.actions{display:flex;justify-content:flex-end;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.hdr .crumb{font-size:12px;color:var(--muted);display:block;font-weight:500}
.sum .card{padding:16px}
.sum .v{font-size:22px;font-weight:800;color:var(--primary);margin-top:6px}
.menu{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center}
.mi{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#2b3342;padding:10px 0;position:relative;border-radius:12px}
.mi:hover:not(:disabled){background:var(--soft)}
.mi svg{color:var(--primary)}
.mi .nd{position:absolute;top:6px;right:calc(50% - 22px);width:9px;height:9px;border-radius:50%;background:#e53935}
.mi:disabled{opacity:.55;cursor:default}
.task{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid #edf1f5;border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(8,87,143,.07)}
.task .go{width:26px;height:26px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;flex:none}
.loginw{display:grid;grid-template-columns:1.1fr 1fr;min-height:800px}
.pw input{padding-right:44px}
.eyebtn{position:absolute;right:6px;top:6px;width:32px;height:32px;border:0;background:none;border-radius:8px;color:#5b6472;display:grid;place-items:center}
.eyebtn:hover{background:var(--soft)}
.inwrap.pw svg{position:static}
div.f{display:flex;flex-direction:column;gap:6px}
.hero{background:linear-gradient(160deg,var(--navy),var(--primary) 70%,#2f7fbf);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;padding:40px;text-align:center}
.hero .disc{background:#fff;border-radius:50%;width:210px;height:210px;display:grid;place-items:center}
.hero h2{font-size:28px;font-weight:900}
.hero p{margin:0;opacity:.85;max-width:360px}
.lform{display:flex;flex-direction:column;justify-content:center;gap:14px;padding:40px;max-width:420px;width:100%;margin:0 auto}
.lform h2{font-size:24px;color:var(--primary)}
@media (max-width:820px){.loginw{grid-template-columns:1fr;overflow:auto}.hero{padding:28px}.hero .disc{width:140px;height:140px}.logo.lg{transform:scale(.7)}}
.ferr{color:var(--bad);font-size:12.5px;font-weight:600;margin-top:-6px}
.content.wide{max-width:1180px}
.fbar{display:grid;grid-template-columns:minmax(0,1fr) 190px 150px auto;gap:10px;align-items:center}
@media (max-width:820px){.fbar{grid-template-columns:1fr 1fr}.fbar .inwrap{grid-column:1/-1}}
.dtable{width:100%;border-collapse:collapse;font-size:12.5px;min-width:720px}
.dtable .chip{white-space:normal;text-align:center}
.dtable th{text-align:left;font-size:10.5px;font-weight:700;color:#fff;background:var(--primary);padding:9px 8px;line-height:1.3}
.dtable th:first-child{border-radius:10px 0 0 10px}.dtable th:last-child{border-radius:0 10px 10px 0}
.dtable td{padding:11px 8px;border-bottom:1px solid #edf1f5;vertical-align:middle}
.dtable tr.cur td{background:#f5f9fd}
.dtable td.empty{text-align:center;color:var(--muted);padding:26px}
.acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.acts .btn{height:30px;padding:0 10px;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.side button.child{padding-left:16px;font-weight:500;font-size:13px;white-space:nowrap}
.thumb .pg{position:relative}
.pgc{position:absolute;right:4px;bottom:4px;background:rgba(0,42,92,.85);color:#fff;font-size:10px;font-weight:700;border-radius:6px;padding:2px 6px}
.pgf{margin:0 0 18px}
.pgf figcaption{font-size:12px;color:var(--muted);margin-top:6px}
/* Lists */
.month{font-size:12px;font-weight:800;color:var(--primary);letter-spacing:.3px;margin-top:4px}
.li{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid #edf1f5;border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(8,87,143,.07)}
.li.unread{border-left:4px solid var(--primary)}
.ic{width:38px;height:38px;border-radius:50%;background:var(--soft);color:var(--primary);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.li b{display:block;font-size:14px}
.li .meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:11px;color:var(--muted);align-items:center}
.li .grow{flex:1;min-width:0}
.mono{font-family:var(--mono);font-size:12.5px}
/* Stepper */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--muted);text-align:center;position:relative}
.st i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1.5px solid #cfd8e2;font-weight:700;font-size:12px;z-index:1}
.st::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:#dfe6ee}
.st:first-child::before{display:none}
.st.on{color:var(--primary);font-weight:700}
.st.on i{background:var(--primary);border-color:var(--primary);color:#fff}
.st.done i{background:var(--ok-soft);border-color:var(--ok-soft);color:var(--ok)}
/* Form bits */
.member{border:1px solid #e6ebf1;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:#fbfcfe}
.member.rej{border-color:var(--bad);background:#fff7f6}
.upbox{position:relative;border:1.5px dashed #c9d3de;border-radius:12px;background:#fff;padding:14px;text-align:center;color:#5b6472;font-size:13px}
.upbox input{position:absolute;inset:0;opacity:0;cursor:pointer}
.upbox small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.file{display:flex;gap:12px;align-items:center;border:1px solid #e6ebf1;border-radius:12px;padding:10px 12px;background:#fff}
.file .fi{width:36px;height:36px;border-radius:8px;background:#fde3e3;display:grid;place-items:center;color:#c0392b;font-size:10px;font-weight:800;flex:none}
.file .grow{flex:1;min-width:0}
.file b{display:block;font-size:13px;word-break:break-all}
.file .rep{position:relative;overflow:hidden;color:var(--primary);font-weight:700;font-size:12px}
.file .rep input{position:absolute;inset:0;opacity:0;cursor:pointer}
.doclab{font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.req{color:var(--bad)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;background:var(--soft);border-radius:12px;padding:12px}
.check input{width:18px;height:18px;accent-color:var(--primary);margin-top:1px}
.src{font-size:11.5px;color:var(--muted)}
.src a{color:var(--primary);font-weight:700}
.dist{font-family:var(--mono)}
.prevgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.thumb{border:1px solid #e6ebf1;border-radius:10px;background:#f7f9fb;padding:6px;text-align:left;display:flex;flex-direction:column;gap:4px}
.thumb .pg{aspect-ratio:3/4;background:#fff;border-radius:6px;display:grid;place-items:center;overflow:hidden;border:1px solid #e6ebf1;font-size:10px;color:var(--muted);text-align:center;padding:4px}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb b{font-size:10.5px;line-height:1.25}
.thumb:disabled{cursor:default}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:24px 1fr;gap:12px;position:relative;padding-bottom:16px;font-size:13px}
.tl li::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:#e3e8ee}
.tl li:last-child{padding-bottom:0}
.tl li:last-child::before{display:none}
.tl .dot{width:24px;height:24px;border-radius:50%;border:2px solid #d6dde6;background:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}
.tl li.done .dot{background:var(--ok-soft);border-color:var(--ok-soft);color:var(--ok)}
.tl li.now .dot{border-color:#f0b429;background:var(--warn-soft)}
.tl small{display:block;color:var(--muted);font-size:11.5px}
/* Panel */
.panel{display:flex;flex-direction:column;gap:14px;align-self:start;position:sticky;top:16px}
@media (max-width:1180px){.panel{position:static;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}}
.pcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}

}
var S = fresh();
var PERSIST = ["notifs","form","hasDraft","draftAt","subs","seq","log","nid","skTujuan","redirected","tpp"];
try{
  var raw = localStorage.getItem(KEY);
  if(raw){ var p = JSON.parse(raw); PERSIST.forEach(function(k){ if(p[k]!==undefined) S[k]=p[k]; }); SK.tujuan=S.skTujuan||"smg"; }
}catch(e){}
function persist(){ try{ var o={}; PERSIST.forEach(function(k){ o[k]=S[k]; }); localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
function pad(n){ return (n<10?"0":"")+n; }
function now(){ var d=new Date(); return pad(d.getHours())+"."+pad(d.getMinutes()); }
function today(){ return new Date().toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"}); }
function kantor(id){ for(var i=0;i<KANTOR.length;i++) if(KANTOR[i].id===id) return KANTOR[i]; return null; }
function kantorNama(id){ var k=kantor(id); return k?k.nama:"-"; }
function distKm(a,b){ if(!kantor(a)||!kantor(b)||a===b) return null; var v=ROAD[[a,b].sort().join("|")]; return v==null?null:v; }
function km(d){ return d==null?"-":Number(d).toLocaleString("id-ID",{maximumFractionDigits:1})+" km"; }
function mapsUrl(a,b){ return "https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(kantor(a).q)+"&destination="+encodeURIComponent(kantor(b).q)+"&travelmode=driving"; }
function srcLine(a,b){ return '<span class="src">Sumber: '+esc(ROAD_SRC)+' · <a href="'+mapsUrl(a,b)+'" target="_blank" rel="noopener">Cek rute real-time di Google Maps ↗</a></span>'; }
function distMsg(d){ return "Jarak kantor lama ke kantor baru "+km(d)+" melalui jalur darat, kurang dari 100 km, sehingga pengajuan SPPD Mutasi tidak dapat diproses."; }
function age(dob){
  if(!dob) return null; var d=new Date(dob+"T00:00:00"); if(isNaN(d)) return null;
  var t=new Date(), a=t.getFullYear()-d.getFullYear(), m=t.getMonth()-d.getMonth();
  if(m<0||(m===0&&t.getDate()<d.getDate())) a--; return a;
}
function fmtDate(iso){ if(!iso) return "-"; var d=new Date(iso+"T00:00:00"); return isNaN(d)?iso:d.toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"}); }
function log(x,c){ S.log.unshift({t:now(), c:c||"info", x:x}); }
function toast(msg){
  var el=document.getElementById("toast"); el.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';
  clearTimeout(toast._t); toast._t=setTimeout(function(){el.innerHTML="";},2800);
}
function unread(){ return S.notifs.filter(function(n){return !n.read;}).length; }
function subFor(no){ return S.subs.filter(function(s){return s.sk===no;})[0]||null; }
function skBy(no){ return SKS.filter(function(s){return s.no===no;})[0]||null; }
function submittedForSK(){ return !!subFor(SK.no); }
function eligibleKids(){ return S.form.anggota.filter(function(m){return m.hub==="Anak" && !m.rejected;}); }
function docLabel(k){ return DOCS.filter(function(d){return d.k===k;})[0].label; }

/* status per baris SK */
function rowStatus(sk){
  var sub=subFor(sk.no);
  if(sub) return {label:STATUS_FLOW[sub.statusIdx], cls:["","warn","warn","ok"][sub.statusIdx]};
  if(sk.current){
    if(S.hasDraft) return {label:"Draft", cls:"warn"};
  }
  return {label:"Belum diisi", cls:"bad"};
}
function rowNoFamily(sk){
  var sub=subFor(sk.no);
  if(sub) return sub.form.bawa==="tidak";
  return false;
}

/* ---------- file & preview ---------- */
function makeDummy(label,name,page,total){
  try{
    var c=document.createElement("canvas"); c.width=600; c.height=800; var x=c.getContext("2d");
    x.fillStyle="#ffffff"; x.fillRect(0,0,600,800); x.fillStyle="#12284f"; x.fillRect(0,0,600,70);
    x.fillStyle="#ffffff"; x.font="bold 22px sans-serif"; x.fillText("CONTOH DOKUMEN (DUMMY)",30,44);
    x.fillStyle="#14213a"; x.font="bold 26px sans-serif"; x.fillText(label.length>34?label.slice(0,34)+"…":label,30,130);
    x.fillStyle="#5a6579"; x.font="18px sans-serif"; x.fillText(name,30,165);
    x.fillStyle="#dde3ec"; for(var i=0;i<14;i++){ x.fillRect(30,210+i*36,((i+page)%4===3?320:540),12); }
    x.fillStyle="#9aa6bb"; x.font="15px sans-serif"; x.fillText("Halaman "+page+" dari "+total,30,770);
    return c.toDataURL("image/png");
  }catch(e){ return null; }
}
function dummyFile(k,name,total){
  var imgs=[]; for(var i=1;i<=total;i++) imgs.push(makeDummy(docLabel(k),name,i,total));
  return {name:name, type:"dummy", thumb:imgs[0], pages:total, imgs:imgs};
}
function pdfDoc(fl){ return window.pdfjsLib.getDocument({data:new Uint8Array(fl.data.slice(0)), isEvalSupported:false}).promise; }
function pageImg(doc,n,w){
  return doc.getPage(n).then(function(page){
    var v0=page.getViewport({scale:1}), vp=page.getViewport({scale:w/v0.width});
    var c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height;
    return page.render({canvasContext:c.getContext("2d"), viewport:vp}).promise.then(function(){ return c.toDataURL("image/jpeg",0.85); });
  });
}
function renderPdf(k){
  var fl=S.files[k]; if(!fl) return; fl.busy=true;
  if(!window.pdfjsLib){ fl.err=true; fl.busy=false; render(); return; }
  pdfDoc(fl).then(function(doc){ fl.pages=doc.numPages; return pageImg(doc,1,900); })
  .then(function(img){ fl.thumb=img; fl.imgs=[img]; })
  .catch(function(err){ fl.err=true; try{ console.error("[SPPD] Pratinjau PDF gagal:", err); }catch(e){} })
  .then(function(){ fl.busy=false; render(); });
}
function renderAllPages(k){
  var fl=S.files[k]; if(!fl || fl.type!=="pdf" || fl.allBusy || !fl.data) return;
  var max=Math.min(fl.pages||1,30); if(fl.imgs && fl.imgs.length>=max) return;
  fl.allBusy=true;
  pdfDoc(fl).then(function(doc){
    var chain=Promise.resolve(), out=(fl.imgs||[]).slice(0,1);
    for(var n=out.length+1;n<=max;n++){ (function(n){ chain=chain.then(function(){ return pageImg(doc,n,900).then(function(img){ out.push(img); fl.imgs=out.slice(); if(S.preview===k) render(); }); }); })(n); }
    return chain;
  }).catch(function(err){ try{ console.error("[SPPD] Halaman PDF gagal:", err); }catch(e){} }).then(function(){ fl.allBusy=false; render(); });
}
function takeFile(dk,file){
  var isT=dk.indexOf("t_")===0, lb=isT?TDOCS[dk]:docLabel(dk), setErr=function(m){ if(isT) S.terrors=[m]; else S.errors=[m]; };
  if(file.size>10*1024*1024){ setErr(lb+": ukuran file "+(file.size/1048576).toFixed(1)+" MB, melebihi batas 10 MB."); log("Menolak unggahan "+file.name+" karena melebihi 10 MB.","bad"); render(); return; }
  var isPdf=/pdf$/i.test(file.type)||/\.pdf$/i.test(file.name), isImg=/^image\//.test(file.type);
  if(!isPdf && !isImg){ setErr(lb+": format file harus PDF, JPG, atau PNG."); render(); return; }
  if(isT){ S.terrors=[]; S.tf.docs[dk]=file.name; } else { S.errors=[]; S.form.docs[dk]=file.name; }
  log("Menerima unggahan dokumen: "+file.name+".","ok");
  if(!isT && dk==="kk"){ S.form.kk=clone(KK_DEFAULT); log("Membaca data Kartu Keluarga (OCR): "+S.form.kk.length+" anggota keluarga terdeteksi.","ok"); if(S.form.bawa==="ya") loadFamily(); }
  if(isPdf){ var rd=new FileReader(); rd.onload=function(){ S.files[dk]={name:file.name, type:"pdf", data:rd.result, pages:0, imgs:[], label:lb}; render(); renderPdf(dk); }; rd.onerror=function(){ S.files[dk]={name:file.name, type:"pdf", err:true}; render(); }; rd.readAsArrayBuffer(file); }
  else { var r=new FileReader(); r.onload=function(){ S.files[dk]={name:file.name, type:"img", thumb:r.result, pages:1, imgs:[r.result], label:lb}; render(); }; r.readAsDataURL(file); }
}

/* ---------- system rules ---------- */
function checkAge(m, announce){
  var was=m.rejected; m.rejected=false; m.reason="";
  if(m.hub==="Anak" && m.tgl){
    var a=age(m.tgl);
    if(a!==null && a>=25){
      m.rejected=true; m.reason="Usia anak yang diajukan 25 tahun atau lebih per tanggal pengajuan, sehingga tidak bisa diproses";
      if(announce && !was) log("Menolak otomatis anak "+m.nama+" karena usia "+a+" tahun (≥ 25).","bad");
    }
  }
}
function loadFamily(){
  var src=S.form.kk||clone(KK_DEFAULT);
  S.form.anggota=src.map(function(m,i){ var x=clone(m); x.id=i+1; return x; });
  S.form.anggota.forEach(function(m){ checkAge(m,true); });
  if(!eligibleKids().length) S.form.bantuanSekolah=false;
  log("Mengambil data anggota keluarga dari Kartu Keluarga: "+S.form.anggota.length+" orang.","info");
}
function v1(){ var d=distKm(S.form.asal,S.form.tujuan); return (d!==null && d<100)?[distMsg(d)]:[]; }
function vDocs(){ var e=[]; DOCS.forEach(function(d){ if(d.req && !S.form.docs[d.k]) e.push(d.label+" wajib diunggah."); }); return e; }
function vFam(){
  var e=[], f=S.form;
  if(!f.bawa) e.push("Pilih apakah Anda membawa keluarga ke lokasi kantor baru.");
  if(f.bawa==="ya"){
    if(!f.anggota.length) e.push("Data anggota keluarga tidak ditemukan pada Kartu Keluarga. Unggah ulang KK yang terbaru.");
    var seen={};
    f.anggota.forEach(function(m){
      if(!/^\d{16}$/.test(m.nik||"")) e.push(m.nama+": NIK pada KK harus 16 digit angka.");
      else { seen[m.nik]=(seen[m.nik]||[]).concat(m.nama); }
    });
    Object.keys(seen).forEach(function(k){ if(seen[k].length>1) e.push("NIK "+k+" dipakai lebih dari satu anggota keluarga ("+seen[k].join(", ")+"). NIK tidak boleh sama."); });
    if(f.bantuanSekolah){
      if(!f.docs.skolAsal) e.push("Surat keterangan pindah dari sekolah asal wajib karena Anda mengajukan bantuan biaya pindah sekolah.");
      if(!f.docs.skolBaru) e.push("Surat keterangan pendaftaran sekolah baru wajib karena Anda mengajukan bantuan biaya pindah sekolah.");
    }
  }
  return e;
}
var VAL={1:v1,2:vDocs,3:vFam};

/* ---------- navigation ---------- */
function toTop(){ try{ window.scrollTo({top:0}); }catch(e){} }
function go(screen, extra, noPush){
  if(!noPush && S.screen!=="login" && S.screen!==screen){ S.hist.push({screen:S.screen, detail:S.detail, step:S.step}); if(S.hist.length>30) S.hist.shift(); }
  S.screen=screen; S.errors=[]; if(extra) for(var k in extra) S[k]=extra[k]; render(); toTop();
}
function back(){
  if(S.screen==="form" && S.step>1){ S.errors=[]; S.step--; render(); toTop(); return; }
  if(S.screen==="tppform" && S.tstep>1){ S.terrors=[]; S.tstep--; S.treviewOk=false; render(); toTop(); return; }
  var p=S.hist.pop() || {screen:"home"};
  var ex={detail:p.detail, reviewOk:false}; if(p.screen==="form") ex.step=p.step;
  go(p.screen, ex, true);
}
function startForm(){
  if(submittedForSK()){ toast("SPPD Mutasi untuk SK ini sudah diajukan."); go("sppd"); return; }
  if(!S.hasDraft){ S.form=emptyForm(); S.step=1; log("Membuka form SPPD Mutasi untuk "+SK.no+". Lokasi kantor diisi otomatis dari SK."); }
  else log("Memuat draft yang tersimpan ("+S.draftAt+").");
  S.form.asal=SK.asal; S.form.tujuan=SK.tujuan;
  go("form",{reviewOk:false});
}
function saveDraft(silent){
  S.hasDraft=true; S.draftAt=today()+", "+now(); persist();
  if(!silent){ log("Menyimpan form sebagai draft.","ok"); toast("Draft tersimpan. Lanjutkan kapan saja dari tabel SPPD Mutasi."); }
}
function next(){
  var e=VAL[S.step]();
  if(e.length){ S.errors=e; log("Form belum berhasil diisi: "+e.length+" alasan dikirim ke karyawan.","bad"); render(); toTop(); return; }
  S.errors=[];
  if(S.step<3){ S.step++; render(); toTop(); }
  else { log("Validasi form lolos. Menampilkan ringkasan untuk direview.","ok"); go("review",{reviewOk:false}); }
}
function toTpp(){
  var e=[].concat(v1(),vDocs());
  if(e.length){ S.errors=e; render(); toTop(); return; }
  S.redirected=true; saveDraft(true);
  log("Karyawan tidak membawa keluarga. Pengajuan dialihkan ke Tiket Pulang Pergi.","info");
  go("tpp",{tppSk:SK.no});
}
function submit(){
  var all=[].concat(v1(),vDocs(),vFam());
  if(all.length){ S.errors=all; log("Submit ditolak sistem: data belum memenuhi ketentuan.","bad"); render(); return; }
  S.seq++; var t="SPPD-MTS-"+new Date().getFullYear()+"-"+String(S.seq).padStart(5,"0");
  var snap=clone(S.form); delete snap.kk;
  S.subs.unshift({ticket:t, created:today()+", "+now(), diajukanISO:isoToday(), statusIdx:0, sk:SK.no, form:snap, history:[today()]});
  if(snap.bawa==="tidak"){ var dl=addDays(isoToday(),7); S.notifs.unshift({id:S.nid++, type:"tpp", title:"Ajukan Tiket PP paling lambat "+fmtDate(dl), body:"Anda tidak membawa keluarga. Batas pengajuan Tiket Pulang Pergi 7 hari setelah SPPD Mutasi diajukan.", time:now(), read:false}); log("Membuka hak Tiket PP. Batas pengajuan pertama "+fmtDate(dl)+".","info"); }
  S.lastTicket=t; S.hasDraft=false; S.draftAt=null; S.redirected=false; S.form=emptyForm(); S.step=1;
  log("Menerima pengajuan dan menerbitkan nomor pelacakan "+t+".","ok");
  log("Meneruskan pengajuan ke antrian verifikasi HCS (HCIS & Office Administration).","info");
  S.notifs.unshift({id:S.nid++, type:"submitted", title:"Pengajuan SPPD Mutasi diterima", body:"Nomor pelacakan "+t+". Status: Diajukan.", time:now(), read:false, ticket:t});
  persist(); S.hist=[{screen:"home"},{screen:"travel"},{screen:"sppd"}]; go("success", null, true);
}
function preset(kind){
  SK.tujuan = kind==="jarak" ? "bgr" : "smg"; S.skTujuan=SK.tujuan;
  S.subs=S.subs.filter(function(s){return s.sk!==SK.no;}); S.redirected=false;
  var f=emptyForm();
  f.docs={sk:"SK_Mutasi_0457.pdf",kk:"KK_Budi_2026.pdf",rek:"rekening_payroll.jpg",skolAsal:null,skolBaru:null};
  f.kk=clone(KK_DEFAULT); if(kind==="umur") f.kk.push(clone(KK_ADULT));
  S.files={sk:dummyFile("sk",f.docs.sk,2), kk:dummyFile("kk",f.docs.kk,1), rek:dummyFile("rek",f.docs.rek,1)};
  S.form=f; S.hasDraft=false; S.step=1;
  var label={valid:"data valid (Jakarta → Semarang, bawa keluarga)", umur:"KK berisi anak usia ≥ 25 tahun", jarak:"SK tujuan Bogor (jarak < 100 km)", tidak:"tidak membawa keluarga"}[kind];
  if(kind==="tidak"){ f.bawa="tidak"; S.step=3; }
  else {
    f.bawa="ya"; loadFamily();
    if(kind==="valid"){ f.bantuanSekolah=true; f.docs.skolAsal="ket_pindah_SDN05.pdf"; f.docs.skolBaru="ket_daftar_SDN02_Smg.pdf"; S.files.skolAsal=dummyFile("skolAsal",f.docs.skolAsal,1); S.files.skolBaru=dummyFile("skolBaru",f.docs.skolBaru,1); }
  }
  S.notifs.forEach(function(n){n.read=true;});
  log("Skenario uji dimuat: "+label+".","info");
  go("form",{reviewOk:false});
}

function addDays(iso,n){ var d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }

function tppEligible(){ var s=subFor(SK.no); return !!(s && s.form.bawa==="tidak"); }

function tppExpired(){ var d=tppDeadline(); return firstPending() && !!d && isoToday()>d; }
function daysLeft(iso){ return Math.round((Date.parse(iso+"T00:00:00")-Date.parse(isoToday()+"T00:00:00"))/864e5); }
function lastTpp(){ var l=null; S.tpp.subs.forEach(function(s){ if(!l || s.diajukan>l) l=s.diajukan; }); return l; }
function nextTpp(){ var l=lastTpp(); return l?addMonths(l,3):null; }

function routeGo(f){ return kantorNama(baseKantor(f))+" → "+HOME.nama; }

function checkTppNotif(){

function vTppValidate(step){
  var f=S.tf, e=[];
  if(step===1){
    if(!f.skema) e.push("Pilih skema: dipesankan kantor atau reimbursement.");
    if(!S.tpp.confirmed) e.push("Konfirmasi kampung halaman Anda terlebih dahulu.");
  }
  if(step===2){
    if(!f.pergi) e.push("Tanggal pergi wajib diisi.");
    if(!f.pulang) e.push("Tanggal pulang wajib diisi.");
    if(f.pergi && f.pulang && f.pulang<f.pergi) e.push("Tanggal pulang tidak boleh sebelum tanggal pergi.");
    if(f.skema==="kantor"){
      if(f.pergi && f.pergi<isoToday()) e.push("Tanggal pergi tidak boleh sebelum hari ini karena tiket akan dipesankan kantor.");
      if(!f.jamPergi) e.push("Jam keberangkatan pergi wajib diisi.");
      if(!f.jamPulang) e.push("Jam keberangkatan pulang wajib diisi.");
    } else {
      if(!(+f.nomPergi>0)) e.push("Nominal tiket pergi wajib diisi sesuai bukti transaksi.");
      if(!(+f.nomPulang>0)) e.push("Nominal tiket pulang wajib diisi sesuai bukti transaksi.");
      if(!f.docs.t_tiket) e.push("File tiket pulang pergi wajib diunggah.");
      if(!f.docs.t_trx) e.push("Riwayat transaksi pembelian wajib diunggah.");
    }
  }
  return e;
}

  S.subs.unshift({ticket:"SPPD-MTS-2026-00150", created:dTxt+", 09.15", diajukanISO:dIso, statusIdx:d0>0?1:0, sk:SK.no, history:d0>0?[dTxt,dTxt]:[dTxt],
    form:{asal:SK.asal, tujuan:SK.tujuan, bawa:"tidak", anggota:[], bantuanSekolah:false}});
  var label={ready:"SPPD Mutasi tanpa keluarga baru dikirim hari ini", soon:"SPPD dikirim 5 hari lalu, batas Tiket PP tinggal 2 hari", expired:"SPPD dikirim 8 hari lalu, Tiket PP belum diajukan", recent:"Tiket PP terakhir diajukan 1 bulan lalu", due:"sudah 3 bulan sejak Tiket PP terakhir"}[kind];
  if(kind==="recent"){ var r=addMonths(t,-1); S.tpp.subs.push({no:"TPP-2026-00018", skema:"kantor", rute:kantorNama(SK.tujuan)+" → "+HOME.nama, pergi:addDays(r,3), pulang:addDays(r,6), total:0, diajukan:r, status:"Selesai"}); }
  if(kind==="due"){ var q=addDays(addMonths(t,-3),-1); S.tpp.subs.push({no:"TPP-2026-00011", skema:"reimburse", rute:kantorNama(SK.tujuan)+" → "+HOME.nama, pergi:addDays(q,2), pulang:addDays(q,5), total:1850000, diajukan:q, status:"Selesai"}); }
  S.notifs.forEach(function(n){n.read=true;});
  log("Skenario uji dimuat: "+label+".","info");
  if(checkTppNotif()) toast("Notifikasi baru masuk ke lonceng.");
  if(S.screen==="login") S.screen="home";
  go("tpp");
}
function topbar(){
  var u=unread();
  return '<header class="topbar"><div class="brandm">'+logo("sm")+'JM-Click</div><div class="sp"></div>'+
    '<button class="bell" data-act="bell" aria-label="Notifikasi, '+u+' belum dibaca">'+ic("bell",22)+(u?'<span class="dot">'+u+'</span>':'')+'</button>'+
    '<div class="prof"><div class="ava">'+ic("user",20)+'</div><div><b>'+esc(EMP.nama)+'</b><span class="sub small">'+esc(EMP.unit)+' · NPP '+esc(EMP.npp)+'</span></div><span class="online" aria-hidden="true"></span></div></header>';
}
function side(){
  var sc=S.screen, inS=["sppd","form","review","success","detail","sk"].indexOf(sc)>=0;
  function b(act,icn,label,on,extra,cls){ return '<button'+(act?' data-act="'+act+'"':' disabled')+' class="'+(on?'on ':'')+(cls||'')+'">'+ic(icn,18)+label+(extra||'')+'</button>'; }
  return '<nav class="side" aria-label="Menu utama"><span class="lab">Menu</span>'+
    b("home","homeI","Beranda",sc==="home")+b("bell","bell","Notifikasi",sc==="notif",unread()?'<span class="nd"></span>':'')+
    '<span class="lab">Layanan</span>'+tmGroup(sc,inS,b)+
    b(null,"list","JMPD")+b(null,"clock","Cuti")+b(null,"presensi","Presensi")+b(null,"chat","Feedback")+b(null,"user","Profile")+'</nav>';
}
function tmGroup(sc,inS,b){
  var inTM=inS||["travel","tpp","tppform","tppok","benefit","panduan","referensi"].indexOf(sc)>=0;
  var open=S.tmOpen===undefined?inTM:S.tmOpen, need=!submittedForSK()&&!S.redirected;
  var h='<div class="grp'+(sc==="travel"?' on':'')+'"><button data-act="travel" class="'+(sc==="travel"?'on':'')+'">'+ic("plane",18)+'Travel Management'+(!open&&need?'<span class="nd"></span>':'')+'</button>'+
    '<button class="chev'+(open?' open':'')+'" data-act="tmtoggle" aria-expanded="'+open+'" aria-label="'+(open?'Sembunyikan':'Tampilkan')+' menu Travel Management">'+ic("chev",16,2.4)+'</button></div>';
  if(!open) return h;
  return h+'<div class="sub-menu">'+
    b("sppd","brief","SPPD Mutasi",inS,need?'<span class="nd"></span>':'',"child")+
    b("tpp","ticket","Tiket Pulang Pergi",["tpp","tppform","tppok"].indexOf(sc)>=0,'',"child")+
    b("benefit","gift","Benefit",sc==="benefit",'',"child")+
    b("panduan","guide","Panduan Pengajuan",sc==="panduan",'',"child")+
    b("referensi","scale","Referensi Mutasi",sc==="referensi",'',"child")+
    b(null,"db","Master Data",false,'<span class="soon">Menyusul</span>',"child")+'</div>';
}
function story(){
  if(S.errors.length || (S.screen==="tppform" && S.terrors.length)) return 5;
  switch(S.screen){
    case "login": return 2; case "home": return submittedForSK()?8:1; case "sk": case "notif": return 1; case "travel": case "benefit": case "panduan": case "referensi": return 2;
    case "sppd": return S.visited[7]?8:2; case "form": return S.step===2?4:3; case "review": return 6; case "success": return 7; case "detail": return 8; case "tpp": return 2; case "tppform": return S.tstep===3?6:3; case "tppok": return 7;
  } return 1;
}
function vPanel(cur){
  var h='<section class="pcard"><h3>Jejak user story <span class="lane">Lane Karyawan</span></h3><ol class="stories">';
  STORIES.forEach(function(n,i){ var k=i+1; h+='<li class="'+(k===cur?'on':(S.visited[k]?'done':''))+'"><i>'+(S.visited[k]&&k!==cur?'✓':k)+'</i>'+n+'</li>'; });
  h+='</ol></section>';
  h+='<section class="pcard"><h3>Aktivitas System <span class="lane">Lane System</span></h3><ul class="log">';
  S.log.slice(0,30).forEach(function(l){ h+='<li class="'+l.c+'"><time>'+esc(l.t)+'</time><span>'+esc(l.x)+'</span></li>'; });
  h+='</ul></section>';
  h+='<section class="pcard"><h3>Skenario uji</h3><div class="scen">'+
    '<button class="btn" data-act="preset" data-k="valid">Isi contoh data valid (bawa keluarga)</button>'+
    '<button class="btn" data-act="preset" data-k="umur">Contoh: KK berisi anak usia ≥ 25 tahun</button>'+
    '<button class="btn" data-act="preset" data-k="jarak">Contoh: SK tujuan &lt; 100 km (Bogor)</button>'+
    '<button class="btn" data-act="preset" data-k="tidak">Contoh: tidak membawa keluarga</button>'+
    '<button class="btn" data-act="remind">System: kirim ulang reminder</button></div>'+
    '<div class="scen" style="margin-top:12px"><span class="lane">Tiket PP</span>'+
    '<button class="btn" data-act="tpreset" data-k="ready">Tiket PP: SPPD tanpa keluarga baru dikirim</button>'+
    '<button class="btn" data-act="tpreset" data-k="soon">Tiket PP: batas 7 hari tinggal 2 hari (pengingat)</button>'+
    '<button class="btn" data-act="tpreset" data-k="expired">Tiket PP: lewat batas 7 hari</button>'+
    '<button class="btn" data-act="tpreset" data-k="recent">Tiket PP: terakhir 1 bulan lalu (ditolak)</button>'+
    '<button class="btn" data-act="tpreset" data-k="due">Tiket PP: sudah 3 bulan (notifikasi)</button></div></section>';
  h+='<section class="pcard"><h3>Aturan sistem yang disimulasikan</h3><ul class="rules"><li>Lokasi kantor lama dan baru diisi otomatis dari SK.</li><li>Jarak kantor lama–baru minimal 100 km lewat jalur darat (sumber Google Maps).</li><li>SK Mutasi, KK, dan foto rekening payroll wajib, maks. 10 MB.</li><li>Anggota keluarga diambil otomatis dari KK; anak usia ≥ 25 tahun ditolak, anggota lain tetap diproses.</li><li>Tombol Tiket PP di tabel aktif untuk mutasi tanpa keluarga yang SPPD-nya sudah dikirim.</li><li>Surat sekolah wajib jika mengajukan bantuan pindah sekolah.</li><li>NPP 5 digit angka.</li><li>Tidak membawa keluarga: SPPD Mutasi tetap dikirim; Tiket PP pertama paling lambat 7 hari setelah SPPD diajukan (pengingat H-2).</li><li>Tiket PP: 3 bulan sekali, notifikasi saat sudah 3 bulan; rute hanya kota kantor baru ↔ kampung halaman (tidak bisa diubah, kampung halaman wajib dikonfirmasi).</li><li>Tiket PP dipesankan kantor: tanggal pergi minimal hari ini, jam keberangkatan wajib.</li><li>Reimbursement: file tiket, riwayat transaksi, dan nominal wajib.</li></ul></section>';
  return h;
}
function render(){
  var map={home:vHome,notif:vNotif,sk:vSK,travel:vTravel,benefit:vBenefit,panduan:vPanduan,referensi:vReferensi,sppd:vSppd,form:vForm,review:vReview,success:vSuccess,detail:vDetail,tpp:vTppHome,tppform:vTppForm,tppok:vTppOk};
  var cur=story(); S.visited[cur]=true;
  document.getElementById("app").innerHTML = S.screen==="login" ? vLogin() : topbar()+'<div class="body">'+side()+'<div class="scr"><div class="content'+(S.screen==="sppd"?' wide':'')+'">'+map[S.screen]()+'</div></div></div>';
  document.getElementById("panel").innerHTML=vPanel(cur);
  var md=document.getElementById("modal");
  if(S.preview && S.files[S.preview] && S.files[S.preview].thumb){
    var fl=S.files[S.preview], lb=fl.label||docLabel(S.preview), imgs=fl.imgs&&fl.imgs.length?fl.imgs:[fl.thumb], total=fl.pages||imgs.length;
    var body=imgs.map(function(src,i){ return '<figure class="pgf"><img src="'+src+'" alt="'+esc(lb)+' halaman '+(i+1)+'"><figcaption>Halaman '+(i+1)+' dari '+total+'</figcaption></figure>'; }).join("");
    if(imgs.length<Math.min(total,30)) body+='<p class="sub">Memuat halaman '+(imgs.length+1)+' dari '+total+'…</p>';
    if(total>30) body+='<p class="sub">Pratinjau dibatasi 30 halaman pertama.</p>';
    md.innerHTML='<div class="modal" data-act="closeprev"><div class="box" role="dialog" aria-label="Pratinjau '+esc(lb)+'"><div class="hd"><div><b>'+esc(lb)+'</b><div class="small muted">'+esc(fl.name)+' · '+total+' halaman'+(fl.type==="dummy"?' · contoh dummy':'')+'</div></div><button class="btn sm" data-act="closeprev">Tutup</button></div><div class="bd">'+body+'</div></div></div>';
  } else md.innerHTML="";
  persist();
}

/* ---------- events ---------- */
function doLogin(){
  var v=(document.getElementById("npp").value||"").trim();
  if(!/^\d{5}$/.test(v)){ S.loginVal=v; S.loginErr="NPP harus 5 digit angka."; render(); return; }
  S.loginErr=""; S.loginVal=v; log("Autentikasi berhasil untuk NPP "+v+".","ok"); checkTppNotif(); go("home");
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]"); if(!t) return;
  var a=t.getAttribute("data-act");
  switch(a){
    case "reset": try{localStorage.removeItem(KEY);}catch(x){} S=fresh(); render(); toast("Simulasi direset ke kondisi awal."); break;
    case "login": doLogin(); break;
    case "pwtoggle": var pw=document.getElementById("pw"); if(pw){ var show=pw.type==="password"; pw.type=show?"text":"password"; t.innerHTML=ic(show?"eyeOpen":"eye",20); t.setAttribute("aria-pressed",String(show)); t.setAttribute("aria-label",show?"Sembunyikan password":"Tampilkan password"); } break;
    case "home": go("home"); break;
    case "bell": go("notif"); break;
    case "notif":
      var id=+t.getAttribute("data-id"), n=S.notifs.filter(function(x){return x.id===id;})[0]; if(!n) break; n.read=true;
      if(n.type==="sk") go("sk"); else if(n.type==="submitted") go("detail",{detail:n.ticket}); else if(n.type==="tpp"||n.type==="tppsub") go("tpp"); else go("sppd"); break;
    case "travel": go("travel"); break;
    case "tmtoggle": var cur=S.tmOpen===undefined?(document.querySelector('.chev.open')!==null):S.tmOpen; S.tmOpen=!cur; render(); break;
    case "benefit": go("benefit"); break;
    case "panduan": go("panduan"); break;
    case "referensi": go("referensi"); break;
    case "ptab": S.panduanTab=t.getAttribute("data-v"); render(); break;
    case "refview": openRef(t.getAttribute("data-r")); break;
    case "tppstart": tppStart(); break;
    case "tskema": S.tf.skema=t.getAttribute("data-v"); S.terrors=[]; render(); break;
    case "tnext": tppNext(); break;
    case "tok": S.treviewOk=true; render(); break;
    case "tedit": S.tstep=+t.getAttribute("data-s"); S.treviewOk=false; S.terrors=[]; render(); toTop(); break;
    case "tsubmit": tppSubmit(); break;
    case "tpreset": tppPreset(t.getAttribute("data-k")); break;
    case "sppd": go("sppd"); break;
    case "tpp": go("tpp",{tppSk:t.getAttribute("data-sk")||(S.redirected?SK.no:null)}); break;
    case "start": startForm(); break;
    case "draft": saveDraft(); render(); break;
    case "next": next(); break;
    case "bawa":
      var v=t.getAttribute("data-v"); S.form.bawa=v; S.errors=[];
      if(v==="ya") loadFamily(); else { S.form.anggota=[]; S.form.bantuanSekolah=false; log("Karyawan memilih tidak membawa keluarga.","info"); }
      if(v==="ya" && S.redirected){ S.redirected=false; }
      render(); break;
    case "edit": S.step=+t.getAttribute("data-s"); go("form"); break;
    case "notok": log("Karyawan menandai data belum benar dan kembali ke form.","info"); S.step=1; go("form"); break;
    case "ok": S.reviewOk=true; render(); break;
    case "submit": submit(); break;
    case "detail": go("detail",{detail:t.getAttribute("data-t")}); break;
    case "copy": try{ navigator.clipboard.writeText(S.lastTicket).then(function(){toast("Nomor pelacakan disalin.");},function(){toast("Tidak bisa menyalin otomatis. Salin manual: "+S.lastTicket);}); }catch(x){ toast("Salin manual: "+S.lastTicket); } break;
    case "preset": preset(t.getAttribute("data-k")); break;
    case "remind":
      if(submittedForSK()){ toast("Tidak ada form yang perlu diingatkan: SPPD sudah diajukan."); break; }
      S.notifs.unshift({id:S.nid++, type:"reminder", title:"Reminder: isi form SPPD Mutasi", body:"Form SPPD Mutasi untuk "+SK.no+" belum disubmit.", time:now(), read:false});
      log("Mengirim ulang reminder pengisian form SPPD Mutasi."); render(); toast("Reminder baru masuk ke notifikasi."); break;
    case "back": back(); break;
    case "fltreset": S.flt={q:"",status:"",year:""}; render(); break;
    case "preview": S.preview=t.getAttribute("data-k"); render(); renderAllPages(S.preview); break;
    case "closeprev": if(e.target===t || t.tagName==="BUTTON"){ S.preview=null; render(); } break;
  }
});
document.addEventListener("input",function(e){
  var el=e.target;
  if(el.id==="npp"){ el.value=el.value.replace(/\D/g,"").slice(0,5); }
  var tk=el.getAttribute&&el.getAttribute("data-t");
  if(tk){
    if(tk.indexOf("nom")===0){ var dg=el.value.replace(/\D/g,"").slice(0,12); S.tf[tk]=dg; el.value=dg?Number(dg).toLocaleString("id-ID"):""; var tt=document.getElementById("ttot"); if(tt) tt.textContent=rp((+S.tf.nomPergi||0)+(+S.tf.nomPulang||0)); }
    else S.tf[tk]=el.value;
  }
  if(el.id==="fq"){ S.flt.q=el.value; var tb=document.getElementById("tbody"); if(tb) tb.innerHTML=tableBody(); }
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.id==="fstatus"){ S.flt.status=el.value; render(); return; }
  if(el.id==="fyear"){ S.flt.year=el.value; render(); return; }
  if(el.id==="tconf"){ S.tpp.confirmed=el.checked; if(el.checked) log("Karyawan mengonfirmasi kampung halaman: "+HOME.nama+".","ok"); S.terrors=[]; render(); return; }
  var tk2=el.getAttribute("data-t"); if(tk2 && tk2.indexOf("nom")!==0){ S.tf[tk2]=el.value; return; }
  if(el.id==="bjab"){ S.benefitLv=el.value.replace(" (jabatan Anda)",""); render(); return; }
  if(el.getAttribute("data-f")){ var k=el.getAttribute("data-f"); S.form[k]=el.type==="checkbox"?el.checked:el.value; render(); return; }
  var dk=el.getAttribute("data-doc");
  if(dk && el.files && el.files[0]){ takeFile(dk, el.files[0]); }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter" && e.target.closest && e.target.closest("[data-form=login]") && e.target.tagName==="INPUT"){ e.preventDefault(); doLogin(); return; }
  if(e.key==="Escape" && S.preview){ S.preview=null; render(); return; }
  if(e.altKey && e.key==="ArrowLeft" && S.screen!=="login" && S.screen!=="home"){ e.preventDefault(); back(); }
});
render();
})();
</script>
</body>
