<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipe SPPD Mutasi Karyawan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
/* Layout: kiri = aplikasi web JM-Click (topbar + sidebar + konten) bergaya Figma JM-Click, kanan = panel simulasi. Satu tema terang. */
:root{
  --primary:#08578f; --navy:#002a5c; --back:#77a4c7; --ink:#1d2433; --muted:#7b8494; --line:#e3e8ee;
  --page:#eef2f6; --card:#ffffff; --soft:#eaf2f9; --ok:#2f7d32; --ok-soft:#c3dfbd; --bad:#d32f2f; --bad-soft:#ffe9e5;
  --warn:#9a6200; --warn-soft:#fff1d6; --font:"Inter", "Segoe UI", system-ui, sans-serif; --mono:"IBM Plex Mono", ui-monospace, monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.45 var(--font)}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #f0b429;outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line)}
.top h1{font-size:17px;font-weight:800;color:var(--primary)}
.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.wrap{display:block;padding:20px;max-width:1440px;margin:0 auto}
@media (max-width:1180px){.wrap{grid-template-columns:1fr}}
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.hdr .bk{width:32px;height:32px;border-radius:50%;border:0;background:var(--back);color:#fff;display:grid;place-items:center;flex:none}
.hdr h2{font-size:20px;font-weight:700;color:var(--primary)}
.sec{font-size:15px;font-weight:700;color:var(--primary)}
.sub{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid #edf1f5;border-radius:14px;box-shadow:0 2px 10px rgba(8,87,143,.07);padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
label.f .hint{font-weight:400;color:var(--muted)}
input[type=text],input[type=password],input[type=date],select{width:100%;height:44px;border:1px solid #dfe4ea;border-radius:10px;padding:0 12px;background:#fff}
input[readonly]{background:#f7f9fb;color:var(--muted)}
input::placeholder{color:#a3aab6}
.inwrap{position:relative}
.inwrap svg{position:absolute;right:12px;top:12px;color:#5b6472;pointer-events:none}
.inwrap.left svg{left:12px;right:auto}
.inwrap.left input{padding-left:38px}
.btn{height:44px;border-radius:10px;border:1px solid #dfe4ea;background:#fff;color:var(--primary);font-weight:700;padding:0 20px;white-space:nowrap}
.btn.block{width:100%}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.sm{height:34px;width:auto;font-size:13px;padding:0 12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--primary);font-weight:700;padding:6px;align-self:center}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.seg button{height:38px;border-radius:20px;border:1px solid #dfe4ea;background:#fff;font-weight:600;color:#3b4453}
.seg button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--primary);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.rows{display:flex;flex-direction:column}
.rows .r{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid #edf1f5;font-size:13px}
.rows .r:last-child{border-bottom:0}
.rows .r span:first-child{color:var(--muted);flex:none}
.rows .r span:last-child{text-align:right;font-weight:600;color:#2b3342}
.alert{border-radius:14px;padding:14px;background:var(--bad-soft)}
.alert .t{display:flex;gap:8px;align-items:center;color:var(--bad);font-weight:700;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid rgba(211,47,47,.15)}
.alert ul{margin:0;padding-left:18px;font-size:13px;color:#3b4453;display:flex;flex-direction:column;gap:6px}
.alert.info{background:var(--soft)}
.alert.info .t{color:var(--primary);border-color:rgba(8,87,143,.15)}
.alert.info p{margin:0;font-size:13px;color:#3b4453}
.okc{width:104px;height:104px;border-radius:50%;background:var(--ok-soft);display:grid;place-items:center;margin:10px auto 4px}
.center{text-align:center}
.big{font-size:22px;font-weight:800;color:var(--primary)}
.navbar{position:fixed;}
.tbar{background:var(--navy);color:#fff;border-radius:8px;padding:9px 12px;font-size:12px;font-weight:600}
/* Web app */
.app{align-self:start;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-height:800px;box-shadow:0 10px 36px rgba(0,42,92,.10)}
.topbar{flex:none;height:60px;display:flex;align-items:center;gap:14px;padding:0 22px;background:#fff;border-bottom:1px solid var(--line)}
.brandm{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;letter-spacing:-.3px;color:#111}
.logo{position:relative;flex:none}
.logo i{position:absolute;left:50%;top:50%;border-radius:50%;background:linear-gradient(180deg,#1f5bb5,#7fa7e0 55%,#f2c46b);transform-origin:50% 50%}
.logo.sm{width:34px;height:34px}
.logo.sm i{width:4px;height:13px;margin:-6.5px 0 0 -2px}
.logo.lg{width:150px;height:150px}
.logo.lg i{width:15px;height:60px;margin:-30px 0 0 -7.5px}
.topbar .sp{flex:1}
.bell{background:none;border:0;position:relative;padding:6px;color:#5b6472;border-radius:10px}
.bell:hover{background:var(--soft)}
.bell .dot{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:9px;background:#e53935;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid #fff;padding:0 3px}
.prof{display:flex;align-items:center;gap:10px;padding-left:14px;border-left:1px solid var(--line)}
.ava{width:38px;height:38px;border-radius:50%;border:1.5px solid #5b6472;display:grid;place-items:center;flex:none;color:#5b6472}
.prof b{display:block;color:var(--primary);font-size:13.5px}
.online{width:9px;height:9px;border-radius:50%;background:#2fb344}
.body{display:grid;grid-template-columns:240px minmax(0,1fr);flex:1;min-height:0}
.side{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;background:#fbfcfe}
.side .lab{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:10px 12px 4px}
.side button{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;border:0;background:none;text-align:left;font-weight:600;color:#3b4453;position:relative}
.side button:hover:not(:disabled){background:#f0f5fa}
.side button.on{background:var(--soft);color:var(--primary)}
.side button:disabled{opacity:.5;cursor:default}
.side .nd{margin-left:auto;width:8px;height:8px;border-radius:50%;background:#e53935}
.scr{padding:28px 32px 48px;background:linear-gradient(180deg,#fff 0%,#fff 72%,#eef5fb 90%,#d5e5f1 100%);background-attachment:local}
.content{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.narrow{max-width:560px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
@media (max-width:820px){.body{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.side .lab{display:none}.side button{flex:none}.scr{padding:20px 16px 36px}.prof div{display:none}}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:980px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tcard{min-height:200px}
.g6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:1100px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}}
.hcsteps{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.hs{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--muted);text-align:center;position:relative;line-height:1.25}
.hs i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1.5px solid #cfd8e2;font-weight:700;font-size:12px;z-index:1}
.hs::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:#dfe6ee}
.hs:first-child::before{display:none}
.hs.on{color:var(--primary);font-weight:700}
.hs.on i{background:var(--primary);border-color:var(--primary);color:#fff}
.hs.done i{background:var(--ok-soft);border-color:var(--ok-soft);color:var(--ok)}
.hcgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1100px){.hcgrid{grid-template-columns:1fr}}
.rabt{border-collapse:collapse;font-size:11px;min-width:900px;width:100%}
.rabt th,.rabt td{border:1px solid #c9d3de;padding:5px 6px;text-align:center;vertical-align:middle}
.rabt th{background:#e8f0f8;color:#1d2433;font-weight:700}
.rabt tr.f th{background:#f5f8fb;font-weight:500;color:var(--muted);font-size:10px}
.paper{background:#fff;color:#111;text-align:left;padding:28px 32px;box-shadow:0 2px 12px rgba(0,0,0,.15);border-radius:4px;font-size:13px}
.paper .ph{display:flex;flex-direction:column;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:14px}
.paper .ph span{font-size:11px;color:#555}
.paper h3{text-align:center;font-size:15px;margin:6px 0 4px;color:#111}
.paper .pc{text-align:center;margin:0 0 12px;font-size:12px}
.paper .sign{text-align:right;margin-top:18px}
.paper{font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.45}
.paper .co{display:flex;flex-direction:column;font-size:11px}
.paper .co b{font-size:12px}
.paper hr{border:0;border-top:1.5px solid #111;margin:8px 0}
.paper hr.dbl{border-top:3px double #111}
.paper .ttl{text-align:center;font-weight:700;font-size:14px;margin:6px 0 14px;line-height:1.35}
.paper .two{display:flex;justify-content:space-between;gap:24px;margin:8px 0}
.paper .kv2{border-collapse:collapse;font-size:11.5px}
.paper .kv2 td{padding:1px 6px 1px 0;vertical-align:top;border:0;text-align:left}
.paper .kv2 td:first-child{white-space:nowrap}
.paper .kv2.num td{padding:5px 8px 5px 0;font-size:12.5px}
.paper .pbox{border:1px solid #111;padding:6px 8px;font-size:11px}
.paper .pbox.rem{min-height:60px;width:300px;font-weight:700}
.paper .bx{display:inline-block;border:1px solid #111;min-width:150px;padding:1px 6px;text-align:right}
.paper .bx.sm{min-width:0;text-align:left}
.paper .sm{font-size:11px}
.paper table.grid{width:100%;border-collapse:collapse;font-size:11px;margin-top:10px}
.paper table.grid th,.paper table.grid td{border:1px solid #111;padding:3px 5px;text-align:center}
.paper table.grid th{font-weight:400}
.paper .n{text-align:right!important;white-space:nowrap}
.paper .disc{font-size:9.5px;color:#444;margin-top:26px}
.paper.po{background:#d8efcf}
.paper.gr{background:#f7d3df}
.paper.land{padding:28px 24px}
.paper .rabt.doc{font-size:10.5px;min-width:1100px}
.paper .rabt.doc th,.paper .rabt.doc td{border-color:#111}
.paper .rabt.doc th{background:#cfe0f3;font-weight:700}
.paper .rabt.doc tr.nums th{background:#cfe0f3;font-weight:400;font-size:9.5px}
.paper .rabt.doc tr.row1 td{height:60px}
.paper .rabt.doc tr.tot td{font-weight:700}
.paper .it{margin:10px 0 4px}
.paper .ket{display:flex;gap:10px;font-size:11.5px}
.paper .sign{display:flex;flex-direction:column;align-items:flex-end;text-align:right;margin-top:16px;font-weight:700;font-size:12px}
.paper .sign .sp{height:46px}
.paper.nd{font-size:13px;padding:36px 48px}
.paper.draft{position:relative;overflow:hidden}
.paper.draft::after{content:"DRAF";position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-24deg);font-size:110px;font-weight:900;color:rgba(211,47,47,.08);pointer-events:none}
.modal .ft{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);background:#fff}
.modal .ft .sub{margin-right:auto}
.rabbase{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:900px){.rabbase{grid-template-columns:1fr 1fr}}
.rabbase > div{background:var(--soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.rabbase select,.rabbase input{height:38px;background:#fff}
.rabbase .bv{font-size:20px;color:var(--primary)}
.costs{display:flex;flex-direction:column;border:1px solid #e6ebf1;border-radius:12px;overflow:hidden}
.cost{display:grid;grid-template-columns:minmax(0,1fr) 190px 190px;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid #edf1f5}
.cost:first-child{border-top:0}
.cost b{display:block;font-size:13.5px}
.cost.head{background:#f5f8fb;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:9px 14px}
.cost.man{background:#fffaf0}
.cost .amt{text-align:right;font-weight:700;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.minp{display:flex;align-items:center;border:1px solid #dfe4ea;border-radius:8px;background:#fff;padding:0 8px;width:170px}
.minp span{color:var(--muted);font-size:12px;font-weight:600}
.minp input{border:0;height:34px;text-align:right;padding:0 0 0 6px;background:transparent;font-weight:700}
.rabsum{margin-left:auto;width:min(420px,100%);background:var(--soft);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.rabsum .big2{border-top:1px solid #cddcea;padding-top:8px;font-size:15px;color:var(--primary)}
.rabsum .big2 b{font-size:20px}
.paper .dummy{margin-top:18px;font-size:10px;color:#999;text-align:center}
.paper .rows .r span:last-child{color:#111}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:1.5px solid #dfe4ea;border-radius:14px;padding:14px;cursor:pointer}
.opt b{display:block;font-size:14px;margin-bottom:2px}
.opt:hover{border-color:var(--primary)}
.opt.on{border-color:var(--primary);background:var(--soft);box-shadow:0 0 0 2px rgba(8,87,143,.15)}
.bignum{font-size:26px;font-weight:800;color:var(--primary)}
input[type=time]{width:100%;height:44px;border:1px solid #dfe4ea;border-radius:10px;padding:0 12px;background:#fff}
.tcard.off{opacity:.6}
.side .grp{display:flex;align-items:center;gap:2px;border-radius:10px}
.side button svg{flex:none}
.side .grp > button:first-child span.lbl{overflow:hidden;text-overflow:ellipsis}
.side .grp > button:first-child{flex:1;min-width:0;white-space:nowrap}
.side .chev{flex:none;width:30px;height:30px;padding:0;display:grid;place-items:center;border-radius:8px;color:#5b6472}
.side .chev svg{transform:rotate(90deg);transition:transform .15s}
.side .chev.open svg{transform:rotate(-90deg)}
.side .chev:hover{background:#f0f5fa}
.side .sub-menu{display:flex;flex-direction:column;gap:2px;margin:2px 0 4px 14px;padding-left:4px;border-left:1.5px solid #e3e8ee}
.side .soon{margin-left:auto;font-size:10px;font-weight:700;color:var(--muted);background:#eef2f6;border-radius:6px;padding:1px 6px}
.plist{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:6px;color:#2b3342}
.psteps{margin:0;padding:0;list-style:none;counter-reset:ps;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:820px){.psteps{grid-template-columns:1fr}}
.psteps li{counter-increment:ps;background:var(--soft);border-radius:12px;padding:12px 12px 12px 48px;position:relative;font-size:13px;display:flex;flex-direction:column;gap:4px}
.psteps li::before{content:counter(ps);position:absolute;left:12px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;font-weight:700;display:grid;place-items:center;font-size:12px}
.psteps li span{color:#3b4453}
@media (max-width:820px){.g2{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end}
.lt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftable{width:100%;border-collapse:collapse;font-size:13px}
.ftable th{text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:0 10px 8px;border-bottom:1px solid #edf1f5}
.ftable td{padding:11px 10px;border-bottom:1px solid #edf1f5;vertical-align:middle}
.ftable tr:last-child td{border-bottom:0}

.ftable tr.rej td{background:#fff7f6}
.tblw{overflow-x:auto}
.famfoot{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:12px 10px 0;margin-top:4px;border-top:1px solid #edf1f5}

@media (max-width:620px){.mgrid{grid-template-columns:1fr 1fr}}

.menu{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center}

.pw input{padding-right:44px}

div.f{display:flex;flex-direction:column;gap:6px}
.hero{background:linear-gradient(160deg,var(--navy),var(--primary) 70%,#2f7fbf);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;padding:40px;text-align:center}

<body>
<header class="top">
  <div>
    <h1>Prototipe JM-Click · SPPD Mutasi</h1>
    <p>Masuk sebagai Karyawan atau HCIS. Semua data di sini dummy.</p>
  </div>
  <button class="btn sm" data-act="reset" id="btn-reset">Reset simulasi</button>
</header>
<div class="wrap">
  <main class="app" id="app" aria-live="polite"></main>
</div>
<div id="modal"></div>
<div id="toast"></div>
<script>
(function(){
"use strict";
var KEY = "sppd-mutasi-proto-v5";
/* ---------- Supabase (Tahap 1: karyawan, sk_mutasi, pengajuan_sppd, dokumen) ----------
   Hanya publishable key. JANGAN taruh secret/service_role key di sini. */
var SB_URL = "https://xlgeqdierinojdsfrekf.supabase.co";
var SB_KEY = "sb_publishable_kWCOhOXOtsxb62g1-vtBUg_zxYuJDzm";
var SUB_SELECT = "*,dokumen(jenis,nama_file),karyawan(nama,level,grade),sk_mutasi(no_sk,kantor_asal,kantor_tujuan,jabatan_baru)"+
  ",pengajuan_keluarga(usia_saat_pengajuan,status,alasan_tolak,keluarga(id,nama,hubungan,tanggal_lahir,nik))";
var DOC_DB = {sk:"sk", kk:"kk", rek:"rekening", skolAsal:"sekolah_asal", skolBaru:"sekolah_baru"};
var DOC_APP = {sk:"sk", kk:"kk", rekening:"rek", sekolah_asal:"skolAsal", sekolah_baru:"skolBaru"};
var dbQueue = Promise.resolve();   /* urutan operasi tulis dari skenario uji */
function sb(path, opt){
  opt=opt||{}; var h={apikey:SB_KEY, "Content-Type":"application/json"}; if(opt.prefer) h.Prefer=opt.prefer;
  return fetch(SB_URL+"/rest/v1/"+path, {method:opt.method||"GET", headers:h, body:opt.body?JSON.stringify(opt.body):undefined})
    .then(function(r){ return r.text().then(function(t){
      var d=null; try{ d=t?JSON.parse(t):null; }catch(x){}
      if(!r.ok){ var e=new Error((d&&d.message)||("HTTP "+r.status)); e.code=d&&d.code; throw e; }
      return d;
    }); });
}
function sbErr(e){
  try{ console.error("[SPPD] Supabase:", e); }catch(x){}
  if(e && e.code==="42501") return "akses database ditolak (izin tabel belum diberikan)";
  if(e && e.code==="23505" && /no_sk/.test(e.message||"")) return "SPPD Mutasi untuk SK ini sudah pernah diajukan";
  if(e instanceof TypeError) return "tidak bisa terhubung ke database, periksa koneksi internet";
  return (e && e.message) || "kesalahan tidak dikenal";
}
function q(v){ return encodeURIComponent(v); }
function inList(arr){ return q("("+arr.map(function(x){ return '"'+x+'"'; }).join(",")+")"); }
function shortDate(iso){ if(!iso) return "-"; var d=new Date(iso+"T00:00:00"); return isNaN(d)?iso:d.toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"}); }
function sbNextTicket(){
  var pre="SPPD-MTS-"+new Date().getFullYear()+"-";
  return sb("pengajuan_sppd?select=no_pengajuan&no_pengajuan=like."+q(pre+"*")+"&order=no_pengajuan.desc&limit=1").then(function(r){
    var n=r&&r[0]?parseInt(r[0].no_pengajuan.slice(-5),10)||0:0; return pre+String(n+1).padStart(5,"0");
  });
}
/* Simpan 1 pengajuan; nomor SPPD-MTS diambil dari nomor terakhir di database */
function sbInsertSub(body){
  var tries=0;
  function attempt(){
    return sbNextTicket().then(function(t){ body.no_pengajuan=t; return sb("pengajuan_sppd",{method:"POST", prefer:"return=representation", body:body}); })
      .then(function(r){ return r[0]; })
      .catch(function(e){ if(e.code==="23505" && /no_pengajuan/.test(e.message||"") && ++tries<4) return attempt(); throw e; });
  }
  return attempt();
}
function fileExt(name){ return String(name||"").split(".").pop().toLowerCase(); }
function tipeFile(name){ var x=fileExt(name); return x==="pdf"?"PDF":(x==="png"?"PNG":"JPG"); }
function docKb(form,k){
  if(form.sizes && form.sizes[k]) return form.sizes[k];
  var fl=S.files[k], n=0; if(fl && fl.imgs) fl.imgs.forEach(function(u){ n+=String(u||"").length*0.75; });
  return Math.max(1, Math.ceil(n/1024));
}
function docRows(id, ticket, form){
  var out=[]; DOCS.forEach(function(d){ var nm=form.docs&&form.docs[d.k]; if(!nm) return;
    out.push({pengajuan_id:id, jenis:DOC_DB[d.k], nama_file:nm, tipe_file:tipeFile(nm), ukuran_kb:docKb(form,d.k), path_storage:"sppd/"+ticket.slice(-5)+"/"+DOC_DB[d.k]+"."+fileExt(nm)}); });
  return out;
}
function sbLoadEmp(npp){ return sb("karyawan?select=*&npp=eq."+q(npp)).then(function(r){ return r&&r[0]||null; }); }
function sbLoadSks(npp){
  return sb("sk_mutasi?select=*&npp=eq."+q(npp)+"&order=tanggal_efektif.desc").then(function(r){
    return (r||[]).map(function(x,i){ return {no:x.no_sk, tanggal:fmtDate(x.tanggal_sk), efektif:x.tanggal_efektif, jabSeb:x.jabatan_lama, asal:x.kantor_asal, jabSet:x.jabatan_baru, tujuan:x.kantor_tujuan, asliTujuan:x.kantor_tujuan, current:i===0}; });
  });
}
/* Baca pengajuan dari Supabase → bentuk S.subs yang dipakai tampilan */
function sbLoadSubs(npp){
  var rows;
  return sb("pengajuan_sppd?select="+SUB_SELECT+(npp?"&npp=eq."+q(npp):"")+"&order=diajukan_pada.desc,id.desc").then(function(r){
    rows=r||[]; return sbLoadHist(rows.map(function(x){ return x.id; }));
  }).then(function(hist){
    var old={}; S.subs.forEach(function(s){ old[s.ticket]=s; });
    var list=rows.map(function(r){ return subFromRow(r, old[r.no_pengajuan], hist[r.id]); });
    if(npp){ var have={}; list.forEach(function(s){ have[s.sk]=1; }); seedSubs(npp).forEach(function(s){ if(!have[s.sk]) list.push(s); }); }
    S.subs=list;
    list.forEach(function(s){ var c=S.hc[s.ticket]; if(!c || s.id==null) return;
      if(c.id!==s.id){ delete S.hc[s.ticket]; return; }
      if(c.stage!==s.tahap){ c.stage=s.tahap; hcFill(s,c); } });
  });
}
function subFromRow(r, loc, dbHist){
  var sk=r.sk_mutasi||{}, k=r.karyawan||{}, docs={}, si=STATUS_FLOW.indexOf(r.status), same=loc&&loc.id===r.id;
  (r.dokumen||[]).forEach(function(d){ var a=DOC_APP[d.jenis]; if(a) docs[a]=d.nama_file; });
  var bawa=r.bawa_keluarga?"ya":"tidak", lf=same&&loc.form;
  var pk=(r.pengajuan_keluarga||[]).filter(function(x){ return x.keluarga; }).sort(function(a,b){ return a.keluarga.id-b.keluarga.id; })
    .map(function(x,i){ var f=x.keluarga; return {id:i+1, kid:f.id, hub:f.hubungan, nama:f.nama, tgl:f.tanggal_lahir, nik:f.nik, rejected:x.status==="Ditolak", reason:x.alasan_tolak||""}; });
  var anggota=bawa==="ya"?(pk.length?pk:((lf&&lf.anggota)||[])):[];
  var hist=(same&&loc.history)?loc.history.slice():[];
  (dbHist||[]).forEach(function(d,i){ if(d) hist[i]=d; });
  if(!hist[0]) hist[0]=shortDate(r.diajukan_pada);
  return {id:r.id, ticket:r.no_pengajuan, npp:r.npp, created:(same&&loc.created)||shortDate(r.diajukan_pada), diajukanISO:r.diajukan_pada,
    statusIdx:si<0?0:si, tahap:Math.max(0,HC_STAGES.indexOf(r.tahap_hcis)), sk:r.no_sk, history:hist,
    emp:{nama:k.nama, npp:r.npp, jabatan:sk.jabatan_baru, level:k.level, grade:k.grade},
    form:{asal:sk.kantor_asal, tujuan:sk.kantor_tujuan, bawa:bawa, anggota:anggota, bantuanSekolah:!!r.bantuan_sekolah, docs:docs}};
}
function sbSetStage(sub, c, si0){
  sub.tahap=c.stage;
  if(sub.id==null) return;
  if(si0!=null && sub.statusIdx!==si0) addRiwayat(sub.id, STATUS_FLOW[si0], STATUS_FLOW[sub.statusIdx], HC_USER.npp, ["","Mulai diproses HCIS","Diserahkan ke ATA",""][sub.statusIdx]);
  var id=sub.id, body={tahap_hcis:HC_STAGES[c.stage], status:STATUS_FLOW[sub.statusIdx]};
  dbQueue=dbQueue.then(function(){ return sb("pengajuan_sppd?id=eq."+id, {method:"PATCH", body:body}); })
    .catch(function(e){ toast("Gagal menyimpan tahap ke database: "+sbErr(e)+"."); });
}
function sbDeleteSk(no){ return sb("pengajuan_sppd?no_sk=eq."+q(no), {method:"DELETE"}); }
/* Muat ulang pengajuan dari Supabase (mis. ada kiriman baru dari laptop lain) */
function refreshSubs(){
  if(S.busy || S.screen==="login") return;
  var npp=S.role==="hcis"?null:EMP.npp, scr=S.screen;
  dbQueue.then(function(){ return Promise.all([sbLoadSubs(npp), npp?sbLoadNotifs(npp):null]); })
    .then(function(){ if(S.screen===scr && !S.busy && !S.preview && !S.hcDoc) render(); })
    .catch(function(e){ toast("Gagal memuat data dari database: "+sbErr(e)+"."); });
}
/* ---------- Supabase Tahap 2: jarak_kantor, keluarga, pengajuan_keluarga, notifikasi, riwayat_status ---------- */
var WIB={timeZone:"Asia/Jakarta"};
var ALASAN_UMUR="Usia anak 25 tahun atau lebih per tanggal pengajuan";
function tsDate(ts){ var d=new Date(ts); return isNaN(d)?"-":d.toLocaleDateString("id-ID",Object.assign({day:"numeric",month:"short",year:"numeric"},WIB)); }
function tsTime(ts){ var d=new Date(ts); return isNaN(d)?"":d.toLocaleTimeString("id-ID",Object.assign({hour:"2-digit",minute:"2-digit",hour12:false},WIB)).replace(":","."); }
function notifTime(ts){ var dd=tsDate(ts); return (dd===tsDate(new Date())?"Hari ini":dd)+", "+tsTime(ts); }
function sbLoadJarak(){
  return sb("jarak_kantor?select=*").then(function(r){
    if(!r||!r.length) return; var m={}, last=null;
    r.forEach(function(x){ m[x.kantor_a+"|"+x.kantor_b]=Number(x.jarak_km); if(!last||new Date(x.dicek_pada)>new Date(last)) last=x.dicek_pada; });
    ROAD=m; ROAD_SRC="snapshot "+String(r[0].sumber||"Google Maps").replace(/\s*\(snapshot\)/i,"")+" "+tsDate(last)+", "+tsTime(last)+" WIB";
  });
}
function sbLoadKeluarga(npp){
  return sb("keluarga?select=*&npp=eq."+q(npp)+"&order=id").then(function(r){
    KK_BY_NPP[npp]=(r||[]).map(function(x){ return {kid:x.id, hub:x.hubungan, nama:x.nama, tgl:x.tanggal_lahir, nik:x.nik}; });
  });
}
function famRows(id, form){
  if(form.bawa!=="ya") return [];
  return form.anggota.filter(function(m){ return m.kid; }).map(function(m){
    return {pengajuan_id:id, keluarga_id:m.kid, usia_saat_pengajuan:age(m.tgl), status:m.rejected?"Ditolak":"Diterima", alasan_tolak:m.rejected?ALASAN_UMUR:null};
  });
}
function notifType(judul, ref){
  judul=judul||""; ref=ref||"";
  if(/tiket pp/i.test(judul)) return "tpp";
  if(/reminder|pengingat/i.test(judul)) return "reminder";
  if(/^SK-/.test(ref)) return "sk";
  if(/^SPPD-MTS-/.test(ref)) return "submitted";
  if(/^TPP-/.test(ref)) return "tpp";
  return "reminder";
}
function sbLoadNotifs(npp){

function pdfDoc(fl){ return window.pdfjsLib.getDocument({data:new Uint8Array(fl.data.slice(0)), isEvalSupported:false}).promise; }
function pageImg(doc,n,w){
  return doc.getPage(n).then(function(page){
    var v0=page.getViewport({scale:1}), vp=page.getViewport({scale:w/v0.width});
    var c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height;
    return page.render({canvasContext:c.getContext("2d"), viewport:vp}).promise.then(function(){ return c.toDataURL("image/jpeg",0.85); });
  });
}
function renderPdf(k){
  var fl=S.files[k]; if(!fl) return; fl.busy=true;
  if(!window.pdfjsLib){ fl.err=true; fl.busy=false; render(); return; }
  pdfDoc(fl).then(function(doc){ fl.pages=doc.numPages; return pageImg(doc,1,900); })
  .then(function(img){ fl.thumb=img; fl.imgs=[img]; })
  .catch(function(err){ fl.err=true; try{ console.error("[SPPD] Pratinjau PDF gagal:", err); }catch(e){} })

function renderAllPages(k){

  var max=Math.min(fl.pages||1,30); if(fl.imgs && fl.imgs.length>=max) return;
  fl.allBusy=true;
  pdfDoc(fl).then(function(doc){
    var chain=Promise.resolve(), out=(fl.imgs||[]).slice(0,1);
    for(var n=out.length+1;n<=max;n++){ (function(n){ chain=chain.then(function(){ return pageImg(doc,n,900).then(function(img){ out.push(img); fl.imgs=out.slice(); if(S.preview===k) render(); }); }); })(n); }
    return chain;
  }).catch(function(err){ try{ console.error("[SPPD] Halaman PDF gagal:", err); }catch(e){} }).then(function(){ fl.allBusy=false; render(); });
}

  if(!silent){ log("Menyimpan form sebagai draft.","ok"); toast("Draft tersimpan. Lanjutkan kapan saja dari tabel SPPD Mutasi."); }
}
function next(){
  var e=VAL[S.step]();
  if(e.length){ S.errors=e; log("Form belum berhasil diisi: "+e.length+" alasan dikirim ke karyawan.","bad"); render(); toTop(); return; }
  S.errors=[];
  if(S.step<3){ S.step++; render(); toTop(); }
  else { log("Validasi form lolos. Menampilkan ringkasan untuk direview.","ok"); go("review",{reviewOk:false}); }
}
function toTpp(){
  var e=[].concat(v1(),vDocs());
  if(e.length){ S.errors=e; render(); toTop(); return; }
  S.redirected=true; saveDraft(true);
  log("Karyawan tidak membawa keluarga. Pengajuan dialihkan ke Tiket Pulang Pergi.","info");
  go("tpp",{tppSk:SK.no});
}
function submit(){
  var all=[].concat(v1(),vDocs(),vFam());
  if(all.length){ S.errors=all; log("Submit ditolak sistem: data belum memenuhi ketentuan.","bad"); render(); return; }
  if(S.busy) return; S.busy=true; toast("Mengirim pengajuan…");
  var snap=clone(S.form); delete snap.kk; var row=null;
  dbQueue.then(function(){
    return sbInsertSub({npp:EMP.npp, no_sk:SK.no, jarak_km:distKm(snap.asal,snap.tujuan), bawa_keluarga:snap.bawa==="ya", bantuan_sekolah:!!snap.bantuanSekolah, status:"Diajukan", tahap_hcis:"Diterima", diajukan_pada:isoToday()});
  }).then(function(r){
    row=r; var docs=docRows(r.id, r.no_pengajuan, snap);
    return docs.length?sb("dokumen",{method:"POST", body:docs}):null;
  }).then(function(){
    var fam=famRows(row.id, snap);
    return fam.length?sb("pengajuan_keluarga",{method:"POST", body:fam}):null;
  }).then(function(){
    return sb("riwayat_status",{method:"POST", body:{objek:"pengajuan_sppd", objek_id:row.id, status_lama:null, status_baru:"Diajukan", oleh_npp:EMP.npp}});
  }).then(function(){
    S.busy=false; submitDone(row, snap);
  }).catch(function(e){
    if(row) sb("pengajuan_sppd?id=eq."+row.id,{method:"DELETE"}).catch(function(){});
    S.busy=false; S.errors=["Pengajuan gagal dikirim: "+sbErr(e)+". Coba submit lagi."]; log("Gagal menyimpan pengajuan ke database.","bad"); render(); toTop();
  });
}
function submitDone(row, snap){
  var t=row.no_pengajuan; delete snap.sizes;
  S.subs.unshift({id:row.id, npp:EMP.npp, tahap:0, ticket:t, created:today()+", "+now(), diajukanISO:row.diajukan_pada||isoToday(), statusIdx:0, sk:SK.no, form:snap, history:[today()],
    emp:{nama:EMP.nama, npp:EMP.npp, jabatan:SK.jabSet, level:EMP.level, grade:EMP.grade}});
  if(snap.bawa==="tidak"){ var dl=addDays(isoToday(),7); addNotif(EMP.npp, "tpp", "Ajukan Tiket PP paling lambat "+fmtDate(dl), "Anda tidak membawa keluarga. Batas pengajuan Tiket Pulang Pergi 7 hari setelah SPPD Mutasi diajukan.", t); log("Membuka hak Tiket PP. Batas pengajuan pertama "+fmtDate(dl)+".","info"); }
  S.lastTicket=t; S.hasDraft=false; S.draftAt=null; S.redirected=false; S.form=emptyForm(); S.step=1;
  log("Menerima pengajuan dan menerbitkan nomor pelacakan "+t+".","ok");
  log("Meneruskan pengajuan ke antrian verifikasi HCS (HCIS & Office Administration).","info");
  addNotif(EMP.npp, "submitted", "Pengajuan SPPD Mutasi diterima", "Nomor pelacakan "+t+". Status: Diajukan.", t);
  persist(); S.hist=[{screen:"home"},{screen:"travel"},{screen:"sppd"}]; go("success", null, true);
}
function preset(kind){
  SK.tujuan = kind==="jarak" ? "bgr" : (SK.asliTujuan||SK.tujuan); S.skTujuan = kind==="jarak" ? "bgr" : null;
  S.subs=S.subs.filter(function(s){return s.sk!==SK.no;}); S.redirected=false;
  var skNo=SK.no; dbQueue=dbQueue.then(function(){ return sbDeleteSk(skNo); }).catch(function(e){ toast("Gagal mereset pengajuan di database: "+sbErr(e)+"."); });
  var f=emptyForm();
  f.docs={sk:"SK_Mutasi_0457.pdf",kk:"KK_Budi_2026.pdf",rek:"rekening_payroll.jpg",skolAsal:null,skolBaru:null};
  f.kk=kkFor(EMP.npp); if(kind==="umur") f.kk.push(clone(KK_ADULT));
  S.files={sk:dummyFile("sk",f.docs.sk,2), kk:dummyFile("kk",f.docs.kk,1), rek:dummyFile("rek",f.docs.rek,1)};
  S.form=f; S.hasDraft=false; S.step=1;
  var label={valid:"data valid (Jakarta → Semarang, bawa keluarga)", umur:"KK berisi anak usia ≥ 25 tahun", jarak:"SK tujuan Bogor (jarak < 100 km)", tidak:"tidak membawa keluarga"}[kind];
  if(kind==="tidak"){ f.bawa="tidak"; S.step=3; }
  else {
    f.bawa="ya"; loadFamily();
    if(kind==="valid"){ f.bantuanSekolah=true; f.docs.skolAsal="ket_pindah_SDN05.pdf"; f.docs.skolBaru="ket_daftar_SDN02_Smg.pdf"; S.files.skolAsal=dummyFile("skolAsal",f.docs.skolAsal,1); S.files.skolBaru=dummyFile("skolBaru",f.docs.skolBaru,1); }
  }
  S.notifs.forEach(function(n){n.read=true;});
  log("Skenario uji dimuat: "+label+".","info");
  go("form",{reviewOk:false});
}

var TDOCS = {t_tiket:"File tiket pulang pergi", t_trx:"Riwayat transaksi pembelian"};

function emptyTpp(){ return {skema:"", base:"baru", pergi:"", pulang:"", jamPergi:"", jamPulang:"", nomPergi:"", nomPulang:"", docs:{t_tiket:null, t_trx:null}}; }
function isoToday(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function addMonths(iso,n){
  var p=iso.split("-").map(Number), y=p[0], m=p[1]-1+n, d=p[2];
  y+=Math.floor(m/12); m=((m%12)+12)%12;
  var last=new Date(y,m+1,0).getDate(); if(d>last) d=last;
  return y+"-"+pad(m+1)+"-"+pad(d);
}
function addDays(iso,n){ var d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function rp(n){ return "Rp"+Number(n||0).toLocaleString("id-ID"); }
function tppEligible(){ var s=subFor(SK.no); return !!(s && s.form.bawa==="tidak"); }
function tppDeadline(){ var s=subFor(SK.no); return s&&s.diajukanISO?addDays(s.diajukanISO,7):null; }
function firstPending(){ return tppEligible() && !S.tpp.subs.length; }
function tppExpired(){ var d=tppDeadline(); return firstPending() && !!d && isoToday()>d; }
function daysLeft(iso){ return Math.round((Date.parse(iso+"T00:00:00")-Date.parse(isoToday()+"T00:00:00"))/864e5); }
function lastTpp(){ var l=null; S.tpp.subs.forEach(function(s){ if(!l || s.diajukan>l) l=s.diajukan; }); return l; }
function nextTpp(){ var l=lastTpp(); return l?addMonths(l,3):null; }
function canTpp(){ if(tppExpired()) return false; var n=nextTpp(); return !n || isoToday()>=n; }
function baseKantor(f){ return SK.tujuan; }
function routeGo(f){ return kantorNama(baseKantor(f))+" → "+HOME.nama; }
function routeBack(f){ return HOME.nama+" → "+kantorNama(baseKantor(f)); }
function homeMaps(f){ return "https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(kantor(baseKantor(f)).q)+"&destination="+encodeURIComponent(HOME.q)+"&travelmode=driving"; }
function checkTppNotif(){
  var d=tppDeadline();
  if(firstPending() && d && !tppExpired() && daysLeft(d)<=2 && S.tpp.remindedFor!==d){
    S.tpp.remindedFor=d; var k=daysLeft(d);
    var tt="Sisa "+(k===0?"hari ini":k+" hari")+" untuk mengajukan Tiket PP";
    if(!hasNotif(tt)) addNotif(EMP.npp, "tpp", tt, "Batas pengajuan Tiket Pulang Pergi "+fmtDate(d)+" (7 hari setelah SPPD Mutasi diajukan).", (subFor(SK.no)||{}).ticket);
    log("Mengirim pengingat batas pengajuan Tiket PP ("+fmtDate(d)+").","info"); return true;
  }
  var l=lastTpp(), n=nextTpp(); if(!l || isoToday()<n || S.tpp.notifiedFor===n) return false;
  S.tpp.notifiedFor=n;
  addNotif(EMP.npp, "tpp", "Tiket PP sudah bisa diajukan lagi", "Sudah 3 bulan sejak pengajuan Tiket PP terakhir ("+fmtDate(l)+"). Anda bisa mengajukan lagi.", null);
  log("Mengirim notifikasi: sudah 3 bulan tanpa pengajuan Tiket PP.","info");
  return true;
}

function vTppValidate(step){
  var f=S.tf, e=[];
  if(step===1){
    if(!f.skema) e.push("Pilih skema: dipesankan kantor atau reimbursement.");
    if(!S.tpp.confirmed) e.push("Konfirmasi kampung halaman Anda terlebih dahulu.");
  }
  if(step===2){
    if(!f.pergi) e.push("Tanggal pergi wajib diisi.");
    if(!f.pulang) e.push("Tanggal pulang wajib diisi.");
    if(f.pergi && f.pulang && f.pulang<f.pergi) e.push("Tanggal pulang tidak boleh sebelum tanggal pergi.");
    if(f.skema==="kantor"){
      if(f.pergi && f.pergi<isoToday()) e.push("Tanggal pergi tidak boleh sebelum hari ini karena tiket akan dipesankan kantor.");
      if(!f.jamPergi) e.push("Jam keberangkatan pergi wajib diisi.");
      if(!f.jamPulang) e.push("Jam keberangkatan pulang wajib diisi.");
    } else {
      if(!(+f.nomPergi>0)) e.push("Nominal tiket pergi wajib diisi sesuai bukti transaksi.");
      if(!(+f.nomPulang>0)) e.push("Nominal tiket pulang wajib diisi sesuai bukti transaksi.");
      if(!f.docs.t_tiket) e.push("File tiket pulang pergi wajib diunggah.");
      if(!f.docs.t_trx) e.push("Riwayat transaksi pembelian wajib diunggah.");
    }
  }
  return e;
}

function doLogin(){
  var v=(document.getElementById("npp").value||"").trim();

  if(S.busy) return;
  var role=S.loginRole||"karyawan", btn=document.querySelector('[data-act="login"]');
  S.loginVal=v; S.busy=true; if(btn){ btn.disabled=true; btn.textContent="Memeriksa NPP…"; }
  function fail(msg){ S.busy=false; S.loginErr=msg; render(); }
  Promise.all([sbLoadEmp(v), sbLoadJarak()]).then(function(res){ var emp=res[0];
    if(!emp) return fail("NPP "+v+" tidak terdaftar di data karyawan.");
    if(role==="hcis" && emp.unit!=="Human Capital Services") return fail("NPP "+v+" bukan pegawai Human Capital Services, tidak bisa masuk sebagai HCIS.");
    if(role==="hcis"){
      HC_USER={nama:emp.nama, npp:emp.npp, jabatan:emp.jabatan};
      return sbLoadSubs(null).then(function(){
        S.busy=false; S.loginErr=""; S.hist=[]; S.role="hcis";
        log("Autentikasi HCIS berhasil untuk NPP "+v+".","ok"); go("hchome",null,true);
      });
    }
    return sbLoadSks(v).then(function(sks){
      if(!sks.length) return fail("Belum ada SK mutasi untuk NPP "+v+", jadi halaman SPPD Mutasi belum bisa dibuka.");
      EMP={nama:emp.nama, npp:emp.npp, unit:emp.unit, level:emp.level, grade:emp.grade||"-", jabatan:emp.jabatan};
      if(emp.kampung_halaman) HOME={nama:emp.kampung_halaman, q:emp.kampung_halaman.replace(/^(Kab\.|Kota)\s+/,"")};
      SKS=sks; SK=SKS[0];
      if(S.empNpp!==v){
        /* NPP berbeda dari sesi sebelumnya di browser ini: mulai data lokal dari awal */
        S.empNpp=v; S.skTujuan=null; S.form=emptyForm(); S.hasDraft=false; S.draftAt=null; S.redirected=false; S.step=1;
        S.tpp={confirmed:false, subs:[], notifiedFor:null, seq:20}; S.flt={q:"",status:"",year:""}; S.files={};
      }

        S.busy=false; S.loginErr=""; S.hist=[]; S.role="karyawan";
        log("Autentikasi berhasil untuk NPP "+v+".","ok"); checkTppNotif(); go("home",null,true);
      });
    });
  }).catch(function(e){ fail("Login gagal: "+sbErr(e)+"."); });
}

    if(el.id.indexOf("ck_")===0){ hc1.check[el.id.slice(3)]=el.value; render(); return; }
    if(el.id==="rab_level"){ hc1.rabIn.level=el.value; S.hcErr=[]; render(); return; }
    if(el.id==="rab_hari"||el.id==="rab_pack"||el.id==="rab_sekolah"){ S.hcErr=[]; render(); return; }
  }
  if(el.id==="hcflt"){ S.hcFlt=el.value; render(); return; }
  if(el.id==="tconf"){ S.tpp.confirmed=el.checked; if(el.checked) log("Karyawan mengonfirmasi kampung halaman: "+HOME.nama+".","ok"); S.terrors=[]; render(); return; }
  var tk2=el.getAttribute("data-t"); if(tk2 && tk2.indexOf("nom")!==0){ S.tf[tk2]=el.value; return; }
  if(el.id==="bjab"){ S.benefitLv=el.value.replace(" (jabatan Anda)",""); render(); return; }
  if(el.getAttribute("data-f")){ var k=el.getAttribute("data-f"); S.form[k]=el.type==="checkbox"?el.checked:el.value; render(); return; }
  var dk=el.getAttribute("data-doc");
  if(dk && el.files && el.files[0]){ takeFile(dk, el.files[0]); }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter" && e.target.closest && e.target.closest("[data-form=login]") && e.target.tagName==="INPUT"){ e.preventDefault(); doLogin(); return; }
  if(e.key==="Escape" && (S.preview||S.hcDoc)){ S.preview=null; S.hcDoc=null; render(); return; }
  if(e.altKey && e.key==="ArrowLeft" && S.screen!=="login" && S.screen!=="home"){ e.preventDefault(); back(); }
});
render();
})();
</script>
</body>
</html>
